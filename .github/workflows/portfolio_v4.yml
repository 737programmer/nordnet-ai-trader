name: Portfolio Backtest V4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt scipy scikit-learn
      - name: Run V4 portfolio backtest
        run: python portfolio_backtest_v4.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-backtest-v4
          path: site/portfolio_backtest_v4.json
          if-no-files-found: warn
